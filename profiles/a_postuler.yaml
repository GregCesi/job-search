# Niveaux extraits qui envoient l'offre dans « À étudier », groupe « trop senior ? »
# (EXE-221, TCK-393). Une offre « Data et analyse » reste dans le groupe
# « est-ce intéressant ? » quel que soit son niveau : la famille décide d'abord.
niveaux_a_etudier:
  - senior
  - lead

# Niveaux extraits du premier groupe de l'ordre (avant les autres).
niveaux_premier_groupe:
  - junior
  - intermediate

# Tranche récente : jours entiers depuis la récupération, bornes incluses.
jours_recents: 14

# Marqueurs retirés du titre avant la comparaison des doublons.
marqueurs_titre:
  - h/f/x
  - h/f
  - f/h
  - m/w/x
  - m/f

# Parcours de candidature (EXE-217, H4) : paramètres de suivi retirés des
# adresses avant de les comparer. Sans casse : tout paramètre qui commence par
# un préfixe, et chaque nom de la liste.
parcours:
  parametres_suivi:
    prefixes:
      - utm_
    noms:
      - cid
      - trid
      - oga
      - gclid
      - fbclid
  # Phrases qui valent fermeture (EXE-218, H3), cherchées sans casse dans le
  # titre et le texte visible de la page de fin, et de la page d'annonce pour
  # Actiris, hors balises script et style. Compléter la liste ne touche pas au code.
  phrases_fermeture:
    - n'est plus disponible
    - no longer available
    - has been filled
    - n'existe pas ou plus
    - offer not found
