# Textes de la carte du code (EXE-213), lus par `python -m outils.carte`.
#
# Un système est un domaine métier, à cheval sur api/ et orchestrator/ : les
# routes d'un domaine sont rangées avec son code. Chaque fichier Python de api/
# et de orchestrator/ est rangé dans un système et un seul ; les `__init__.py`
# vides ne sont pas cités.
#
# La phrase d'un fichier vient de sa docstring de module. La table [phrases]
# donne celle des fichiers qui n'en ont pas, sans toucher au code.
#
# Écrit le 25 novembre 2026, EXE-213.

[[systeme]]
id = "socle"
nom = "Socle"
role = "Démarre l'API, fixe les chemins du projet, ouvre la base SQLite et crée ses tables."
fichiers = [
  "api/main.py",
  "api/db.py",
  "api/schemas.py",
  "orchestrator/job_search/paths.py",
  "orchestrator/job_search/storage/db.py",
]

[[systeme]]
id = "sources"
nom = "Sources d'offres"
role = "Va chercher les offres chez chaque source et les traduit dans le schéma neutre JobOffer."
fichiers = [
  "orchestrator/job_search/sources/base.py",
  "orchestrator/job_search/sources/_clean.py",
  "orchestrator/job_search/sources/fingerprint.py",
  "orchestrator/job_search/sources/france_travail.py",
  "orchestrator/job_search/sources/remotive.py",
  "orchestrator/job_search/sources/indeed_file.py",
  "orchestrator/job_search/sources/eures.py",
  "orchestrator/job_search/sources/forem.py",
  "orchestrator/job_search/sources/actiris.py",
]

[[systeme]]
id = "run"
nom = "Run matinal et ingestion"
role = "Enchaîne le run du matin : collecte, dédoublonnage, chaîne d'une offre nouvelle, rescore et digest."
fichiers = [
  "orchestrator/job_search/run.py",
  "orchestrator/job_search/ingestion.py",
  "orchestrator/job_search/rescore.py",
  "orchestrator/job_search/storage/dedup.py",
  "orchestrator/job_search/digest/formatter.py",
]

[[systeme]]
id = "scoring"
nom = "Extraction et scoring"
role = "Extrait les faits d'une offre par le modèle local, puis calcule en Python filtres, désirabilité, atteignabilité et catégorie."
fichiers = [
  "orchestrator/job_search/scoring/extractor.py",
  "orchestrator/job_search/scoring/filters.py",
  "orchestrator/job_search/scoring/aliases.py",
  "orchestrator/job_search/scoring/ad_language.py",
  "orchestrator/job_search/scoring/desirability.py",
  "orchestrator/job_search/scoring/attainability.py",
  "orchestrator/job_search/scoring/categorize.py",
  "orchestrator/job_search/scoring/hors_perimetre.py",
  "orchestrator/job_search/matching/profile.py",
]

[[systeme]]
id = "offres"
nom = "Offres"
role = "Range les offres en base et les sert à l'interface : liste, détail, filtre du profil de vue et expiration."
fichiers = [
  "api/offers.py",
  "api/view_profile.py",
  "api/expiration.py",
  "orchestrator/job_search/storage/offers.py",
  "orchestrator/job_search/expiration/service.py",
]

[[systeme]]
id = "ajout"
nom = "Ajout à la main"
role = "Ajoute une offre trouvée à la main, par son URL ou son texte, et l'identifie quand elle n'a pas de titre."
fichiers = [
  "api/ajouts.py",
  "orchestrator/job_search/ajout/__init__.py",
  "orchestrator/job_search/ajout/service.py",
  "orchestrator/job_search/ajout/identification.py",
  "orchestrator/job_search/sources/manual.py",
]

[[systeme]]
id = "suivi"
nom = "Suivi des candidatures"
role = "Tient le tri des offres, l'étape de chaque candidature et l'historique des gestes, par le seul module d'états."
fichiers = [
  "orchestrator/job_search/suivi/etats.py",
  "orchestrator/job_search/suivi/storage.py",
  "orchestrator/job_search/suivi/reprise.py",
  "orchestrator/job_search/verdict.py",
]

[[systeme]]
id = "a_postuler"
nom = "À postuler"
