fiche = [2, 0]
cv = [2, 1]
lettre = [2, 2]
banc = [2, 3]
mail = [3, 0]
pieces = [3, 1]
suivi = [3, 2]
reference = [3, 3]
run = [4, 0]
scoring = [4, 1]
sources = [4, 2]
socle = [4, 3]
