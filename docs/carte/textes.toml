[phrases]
"orchestrator/job_search/matching/profile.py" = "Charge et valide le profil cible YAML, et calcule son hash."
"orchestrator/job_search/digest/formatter.py" = "Met en forme le digest texte du run : les meilleures offres, rangées par catégorie."
"orchestrator/job_search/storage/db.py" = "Ouvre la connexion SQLite, crée les tables et applique les migrations de schéma."
"orchestrator/job_search/storage/reviews.py" = "Écrit et lit les avis humains par critère, dans la table human_reviews."
"orchestrator/job_search/storage/offers.py" = "Enregistre une offre en base et relit les offres enregistrées."
"orchestrator/job_search/storage/dedup.py" = "Écarte les offres déjà en base, par source et identifiant ou par empreinte."
"orchestrator/job_search/sources/fingerprint.py" = "Calcule l'empreinte d'une offre depuis son titre, son entreprise et son lieu."
"orchestrator/job_search/sources/remotive.py" = "Adapter Remotive : va chercher les offres de développement en télétravail et les traduit en JobOffer."
"orchestrator/job_search/sources/base.py" = "Définit le schéma neutre JobOffer, les faits extraits et l'interface Source que chaque adapter implémente."
"orchestrator/job_search/sources/france_travail.py" = "Adapter France Travail : obtient le jeton OAuth2, pagine la recherche d'offres et traduit chaque offre en JobOffer."
