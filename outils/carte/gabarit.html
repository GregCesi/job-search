<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte du code — job-search</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --fond: #f6f3ec;
    --carte: #fffdf8;
    --encre: #22201c;
    --doux: #6b655b;
    --trait: #ddd6c8;
    --accent: #1f5f8b;
    --accent-pale: #e3eef6;
    --alerte: #a2471b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--encre);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
    padding: 16px 28px; border-bottom: 1px solid var(--trait); background: var(--carte);
  }
  header h1 { font-size: 18px; margin: 0; }
  #meta { color: var(--doux); font-size: 13px; }
  #recherche { margin-left: auto; position: relative; }
  #recherche input {
    width: 340px; max-width: 80vw; padding: 7px 10px; font: inherit;
    border: 1px solid var(--trait); border-radius: 6px; background: var(--fond);
  }
  #resultats {
    position: absolute; right: 0; top: 100%; z-index: 2; margin: 4px 0 0; padding: 4px 0;
    width: 460px; max-width: 90vw; max-height: 60vh; overflow: auto; list-style: none;
    background: var(--carte); border: 1px solid var(--trait); border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,.08);
  }
  #resultats:empty { display: none; }
  #resultats li a { display: block; padding: 5px 12px; }
  #resultats li a:hover, #resultats li a:focus { background: var(--accent-pale); }
  #resultats small { display: block; color: var(--doux); font-family: inherit; }
  nav.ariane { padding: 10px 28px; font-size: 14px; color: var(--doux); }
  nav.ariane a, nav.ariane span { margin-right: 6px; }
  nav.ariane .sep { color: var(--trait); }
  main { padding: 4px 28px 48px; max-width: 1180px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .chemin, #resultats a, li.fichier > a, section.liens a, section.liens span.test {
    font-family: var(--mono); font-size: 13px;
  }
  h2 { font-size: 22px; margin: 12px 0 4px; }
  h2.chemin { font-size: 18px; word-break: break-all; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  .role, .phrase { margin: 4px 0 8px; }
  .compte, .lignes, .systeme-du-fichier { color: var(--doux); font-size: 13px; margin: 0; }
  .grille {
    display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    margin: 12px 0 28px;
  }
  article.systeme {
    background: var(--carte); border: 1px solid var(--trait); border-radius: 8px;
    padding: 14px 16px; border-top: 4px solid var(--accent);
  }
  article.systeme.autres { border-top-color: var(--alerte); }
  article.systeme h3 a { color: var(--encre); }
  article.systeme .role { font-size: 14px; }
  ul.fleches { list-style: none; padding: 0; margin: 8px 0 0; }
  li.fleche {
    display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 12px; align-items: center;
    padding: 4px 0; border-bottom: 1px dashed var(--trait); font-size: 14px;
  }
  li.fleche .barre { height: 8px; background: var(--accent); border-radius: 4px; opacity: .55; }
  ul.fichiers { list-style: none; padding: 0; margin: 10px 0; }
  li.fichier {
    padding: 8px 12px; margin-bottom: 6px; background: var(--carte);
    border: 1px solid var(--trait); border-radius: 6px;
  }
  li.fichier .phrase-courte { display: block; color: var(--doux); font-size: 14px; }
  li.fichier.sans-phrase .phrase-courte, .phrase.sans-phrase { color: var(--alerte); }
  .colonnes { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  section.liens {
    background: var(--carte); border: 1px solid var(--trait); border-radius: 8px; padding: 12px 14px;
  }
  section.liens ul { list-style: none; margin: 0; padding: 0; }
  section.liens li { padding: 2px 0; word-break: break-all; }
  section.liens .vide { color: var(--doux); margin: 0; font-size: 14px; }
  .bloc { margin: 18px 0; }
  nav.vues { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 12px 0 4px; font-size: 14px; }
  .total-base { font-size: 16px; margin: 4px 0 8px; }
  ol.base-fichiers { margin: 6px 0 0; padding-left: 22px; }
  ol.base-fichiers li, ul.routes li, ul.tables li { padding: 2px 0; font-size: 14px; }
  ol.base-fichiers a, ul.routes a, .route-id, h2.route { font-family: var(--mono); }
  ol.base-fichiers .n { color: var(--doux); }
  ul.routes, ul.tables { list-style: none; padding: 0; margin: 10px 0; }
  h2.route, h2.table { font-size: 18px; word-break: break-all; }
  .couche, .appels-base, .servie-par, .acces-base, .ecrivains { color: var(--doux); font-size: 13px; margin: 0; }
  .ecrivains { font-size: 15px; color: var(--encre); margin: 6px 0; }
  section.liens .note { color: var(--doux); font-family: inherit; font-size: 13px; }
  section.liens .non-relie { color: var(--alerte); font-family: inherit; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Carte du code de job-search</h1>
  <span id="meta"></span>
  <div id="recherche">
    <input type="search" id="champ" aria-label="Rechercher un fichier, une route ou une table"
           placeholder="Rechercher un fichier, une route ou une table" autocomplete="off">
    <ul id="resultats"></ul>
  </div>
</header>
<nav class="ariane" aria-label="Fil d'Ariane"></nav>
<main id="vue"></main>
<script id="donnees" type="application/json">__DONNEES__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("donnees").textContent);
  var SANS_PHRASE = "Pas de phrase pour ce fichier.";
  var systemes = D.systemes.slice();
  var autres = { id: D.autres_systeme.id, nom: D.autres_systeme.nom,
                 role: D.autres_systeme.role, fichiers: D.autres };
  var FRONT = D.fichiers_front || {};
  var ROUTES = D.routes || {};
  var TABLES = D.tables || {};
  var AV = D.a_verifier || {};
  var tous = (D.ecrans ? [D.ecrans] : []).concat(systemes, [autres]);
  function F(c) { return D.fichiers[c] || FRONT[c]; }
  var parId = {};
  tous.forEach(function (s) { parId[s.id] = s; });

  function el(tag, attrs, enfants) {
    var n = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "texte") n.textContent = attrs[k];
      else if (k === "classe") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (enfants || []).forEach(function (e) { if (e) n.appendChild(e); });
    return n;
  }
  function pluriel(n, mot) { return n + " " + mot + (n === 1 ? "" : "s"); }
  function lienSysteme(s) { return el("a", { href: "#/systeme/" + encodeURIComponent(s.id), texte: s.nom }); }
  function lienFichier(c) { return el("a", { href: "#/fichier/" + c, texte: c }); }
  function lienRoute(id) { return el("a", { href: "#/route/" + encodeURIComponent(id), texte: id }); }
  function lienTable(n) { return el("a", { href: "#/table/" + encodeURIComponent(n), texte: n }); }
  function texte(s) { return document.createTextNode(s); }
  function compteAppels(n) { return n + (n === 1 ? " appel direct" : " appels directs"); }

  function ariane(etapes) {
    var nav = document.querySelector("nav.ariane");
    nav.textContent = "";
    etapes.forEach(function (e, i) {
      if (i > 0) nav.appendChild(el("span", { classe: "sep", texte: "›", "aria-hidden": "true" }));
      if (i < etapes.length - 1) nav.appendChild(el("a", { href: e.href, texte: e.texte }));
      else nav.appendChild(el("span", { texte: e.texte, "aria-current": "page" }));
    });
  }

  function listeFleches(fleches) {
    var ul = el("ul", { classe: "fleches" });
    var max = Math.max.apply(null, fleches.map(function (f) { return f.n; }).concat([1]));
    fleches.forEach(function (f) {
      var texte = el("span", {}, [lienSysteme(parId[f.de]), document.createTextNode(" → "),
        lienSysteme(parId[f.vers]), document.createTextNode(" · " + pluriel(f.n, "import"))]);
      var barre = el("div", { classe: "barre", style: "width:" + Math.max(6, Math.round(120 * f.n / max)) + "px" });
      ul.appendChild(el("li", { classe: "fleche", "data-de": f.de, "data-vers": f.vers }, [texte, barre]));
    });
    return ul;
  }

  function vueCarte() {
    ariane([{ texte: "Carte" }]);
    var grille = el("div", { classe: "grille" });
    tous.forEach(function (s) {
      grille.appendChild(el("article", { classe: "systeme" + (s.id === autres.id ? " autres" : "") }, [
        el("h3", {}, [lienSysteme(s)]),
        el("p", { classe: "role", texte: s.role }),
        el("p", { classe: "compte", texte: pluriel(s.fichiers.length, "fichier") })
      ]));
    });
    var blocFleches = el("section", { classe: "bloc" }, [
      el("h2", { texte: "Flèches entre systèmes" }),
      el("p", { classe: "compte", texte: "Une flèche compte les fichiers d'un système qui importent un fichier d'un autre (un import par couple de fichiers)." })
    ]);
    if (D.fleches.length) blocFleches.appendChild(listeFleches(D.fleches));
    else blocFleches.appendChild(el("p", { classe: "vide", texte: "Aucune flèche entre systèmes." }));
    return blocChaine().concat([el("h2", { texte: "Systèmes" }), grille, blocFleches]);
  }

  function nbAVerifier() {
    return ["appels_sans_route", "adresses", "routes_sans_appel", "tables_illisibles"]
      .reduce(function (n, k) { return n + (AV[k] || []).length; }, 0);
  }

  function blocChaine() {
    var base = D.base || { hors_stockage: 0, fichiers: [] };
    var nav = el("nav", { classe: "vues", "aria-label": "Vues" }, [
      el("a", { href: "#/routes", texte: "Routes" }), texte(Object.keys(ROUTES).length + " · "),
      el("a", { href: "#/tables", texte: "Tables" }), texte(Object.keys(TABLES).length + " · "),
      el("a", { href: "#/a-verifier", texte: "À vérifier" }), texte(String(nbAVerifier()))
    ]);
    var ol = el("ol", { classe: "base-fichiers" }, base.fichiers.map(function (cn) {
      return el("li", {}, [lienFichier(cn[0]), el("span", { classe: "n", texte: " · " + compteAppels(cn[1]) })]);
    }));
    return [nav, el("section", { classe: "bloc" }, [
      el("h2", { texte: "La base" }),
      el("p", { classe: "total-base", texte: compteAppels(base.hors_stockage) + " à la base hors stockage, dans " + pluriel(base.fichiers.length, "fichier") }),
      ol
    ])];
  }

  function vueSysteme(s) {
    ariane([{ texte: "Carte", href: "#/" }, { texte: s.nom }]);
    var ul = el("ul", { classe: "fichiers" });
    s.fichiers.forEach(function (c) {
      var f = F(c);
      var sans = f.phrase === SANS_PHRASE;
      ul.appendChild(el("li", { classe: "fichier" + (sans ? " sans-phrase" : "") }, [
        lienFichier(c), el("span", { classe: "phrase-courte", texte: f.phrase })
      ]));
    });
    var sortantes = D.fleches.filter(function (f) { return f.de === s.id; });
    var entrantes = D.fleches.filter(function (f) { return f.vers === s.id; });
    var parts = [
      el("h2", { texte: s.nom }),
      el("p", { classe: "role", texte: s.role }),
      el("p", { classe: "compte", texte: pluriel(s.fichiers.length, "fichier") }),
      s.fichiers.length ? ul : el("p", { classe: "vide", texte: "Aucun fichier." })
    ];
    if (sortantes.length) parts.push(el("section", { classe: "bloc" }, [el("h3", { texte: "Ce système importe" }), listeFleches(sortantes)]));
    if (entrantes.length) parts.push(el("section", { classe: "bloc" }, [el("h3", { texte: "Ce système est importé par" }), listeFleches(entrantes)]));
    return parts;
  }

  function sectionLiens(titre, chemins, vide, cliquables) {
    var contenu;
    if (!chemins.length) contenu = el("p", { classe: "vide", texte: vide });
    else contenu = el("ul", {}, chemins.map(function (c) {
      return el("li", {}, [cliquables ? lienFichier(c) : el("span", { classe: "test", texte: c })]);
    }));
    return el("section", { classe: "liens" }, [el("h3", { texte: titre + " (" + chemins.length + ")" }), contenu]);
  }

  function sectionListe(titre, items, vide, rendu) {
    var contenu = items.length
      ? el("ul", {}, items.map(function (x) { return el("li", {}, rendu(x)); }))
      : el("p", { classe: "vide", texte: vide });
    return el("section", { classe: "liens" }, [el("h3", { texte: titre + " (" + items.length + ")" }), contenu]);
  }

  function enteteFichier(c, f, s) {
    ariane([{ texte: "Carte", href: "#/" }, { texte: s.nom, href: "#/systeme/" + encodeURIComponent(s.id) }, { texte: c }]);
    return [
      el("h2", { classe: "chemin", texte: c }),
      el("p", { classe: "phrase" + (f.phrase === SANS_PHRASE ? " sans-phrase" : ""), texte: f.phrase }),
      el("p", { classe: "lignes", texte: pluriel(f.lignes, "ligne") }),
      el("p", { classe: "systeme-du-fichier" }, [texte("Système : "), lienSysteme(s)])
    ];
  }

  function etatAppel(a) {
    if (!a.lisible) return [el("span", { classe: "non-relie", texte: " · adresse illisible" })];
    if (!a.routes.length) return [el("span", { classe: "non-relie", texte: " · appel sans route trouvée" })];
    return a.routes.reduce(function (acc, id) { return acc.concat([texte(" → "), lienRoute(id)]); }, []);
  }

  function vueFichierFront(c, f) {
    return enteteFichier(c, f, parId[f.systeme]).concat([
      el("div", { classe: "colonnes bloc" }, [
        sectionListe("Routes qu'il appelle", f.routes, "Il n'appelle aucune route de la carte.", function (id) { return [lienRoute(id)]; }),
        sectionListe("Stores qu'il importe", f.stores, "Il n'importe aucun store.", function (x) { return [lienFichier(x)]; }),
        sectionListe("Composants qu'il utilise", f.composants, "Il n'utilise aucun composant.", function (x) { return [lienFichier(x)]; })
      ]),
      el("div", { classe: "bloc" }, [
        sectionListe("Ses appels à l'API", f.appels, "Aucun appel à l'API dans ce fichier.", function (a) {
          return [el("span", { classe: "route-id", texte: a.methode + " " + a.adresse }),
                  el("span", { classe: "note", texte: " · ligne " + a.ligne })].concat(etatAppel(a));
        })
      ])
    ]);
  }

  function vueFichier(c) {
    if (FRONT[c]) return vueFichierFront(c, FRONT[c]);
    var f = D.fichiers[c];
    var s = parId[f.systeme];
    var chaine = f.couche === undefined ? [] : [
      el("p", { classe: "couche", texte: "Couche : " + f.couche }),
      el("p", { classe: "appels-base", texte: "Appels directs à la base : " + f.appels_base }),
      el("div", { classe: "colonnes bloc" }, [
        sectionListe("Routes qu'il déclare", f.routes, "Il ne déclare aucune route.", function (id) {
          return [lienRoute(id), el("span", { classe: "note", texte: " · " + ROUTES[id].fonction })];
        }),
        sectionListe("Tables qu'il lit", f.tables_lues, "Il ne lit aucune table.", function (n) { return [lienTable(n)]; }),
        sectionListe("Tables qu'il écrit", f.tables_ecrites, "Il n'écrit aucune table.", function (n) { return [lienTable(n)]; })
      ])
    ];
    return enteteFichier(c, f, s).concat(chaine, [
      el("div", { classe: "colonnes bloc" }, [
        sectionLiens("Ce qu'il importe", f.importe, "Il n'importe aucun fichier de la carte.", true),
        sectionLiens("Qui l'importe", f.importe_par, "Aucun fichier de la carte ne l'importe.", true),
        sectionLiens("Les tests qui l'importent", f.tests, "Aucun test ne l'importe directement.", false)
      ])
    ]);
  }

  function vueRoutes() {
    ariane([{ texte: "Carte", href: "#/" }, { texte: "Routes" }]);
    var ids = Object.keys(ROUTES).sort();
    return [el("h2", { texte: "Routes" }), el("p", { classe: "compte", texte: pluriel(ids.length, "route") }),
      el("ul", { classe: "routes" }, ids.map(function (id) {
        return el("li", { classe: "route" }, [lienRoute(id), el("span", { classe: "note", texte: " · " + ROUTES[id].fichier })]);
      }))];
  }

  function vueRoute(id) {
    var r = ROUTES[id];
    ariane([{ texte: "Carte", href: "#/" }, { texte: "Routes", href: "#/routes" }, { texte: id }]);
    return [
      el("h2", { classe: "route", texte: id }),
      el("p", { classe: "servie-par" }, [texte("Servie par "), lienFichier(r.fichier),
        texte(", fonction " + r.fonction + " (ligne " + r.ligne + ")")]),
      el("p", { classe: "acces-base", texte: "Accès à la base : " + r.base }),
      el("div", { classe: "colonnes bloc" }, [
        sectionListe("Appelée par", r.appelee_par, "Aucun appel trouvé dans le front.", function (x) { return [lienFichier(x)]; })
      ])
    ];
  }

  function vueTables() {
    ariane([{ texte: "Carte", href: "#/" }, { texte: "Tables" }]);
    var noms = Object.keys(TABLES).sort();
    return [el("h2", { texte: "Tables" }), el("p", { classe: "compte", texte: pluriel(noms.length, "table") + ", créées par le code" }),
      el("ul", { classe: "tables" }, noms.map(function (n) {
        var t = TABLES[n];
        return el("li", { classe: "table" }, [lienTable(n), el("span", { classe: "note",
          texte: " · lue par " + pluriel(t.lue_par.length, "fichier") + ", écrite par " + pluriel(t.ecrite_par.length, "fichier") })]);
      }))];
  }

  function fichierEtSysteme(c) {
    var s = parId[F(c).systeme];
    return [lienFichier(c), texte(" · "), lienSysteme(s)];
  }

  function vueTable(n) {
    var t = TABLES[n];
    var ecrivains = {};
    t.ecrite_par.forEach(function (c) { ecrivains[F(c).systeme] = true; });
    var nb = Object.keys(ecrivains).length;
    ariane([{ texte: "Carte", href: "#/" }, { texte: "Tables", href: "#/tables" }, { texte: n }]);
    return [
      el("h2", { classe: "table", texte: n }),
      el("p", { classe: "ecrivains", texte: nb + (nb === 1 ? " système écrit" : " systèmes écrivent") + " cette table" }),
      el("div", { classe: "colonnes bloc" }, [
        sectionListe("Fichiers qui la lisent", t.lue_par, "Aucun fichier ne la lit.", fichierEtSysteme),
        sectionListe("Fichiers qui l'écrivent", t.ecrite_par, "Aucun fichier ne l'écrit.", fichierEtSysteme)
      ])
    ];
  }

  function appelNonRelie(a) {
    return [lienFichier(a.fichier), el("span", { classe: "note", texte: " · ligne " + a.ligne + " · " }),
            el("span", { classe: "route-id", texte: a.methode + " " + a.adresse })];
  }

  function vueAVerifier() {
    ariane([{ texte: "Carte", href: "#/" }, { texte: "À vérifier" }]);
    return [
      el("h2", { texte: "À vérifier" }),
      el("p", { classe: "compte", texte: "Ce que les règles de lecture de la carte n'ont pas su relier." }),
      el("div", { classe: "bloc" }, [sectionListe("Appel sans route trouvée", AV.appels_sans_route || [], "Aucun.", appelNonRelie)]),
      el("div", { classe: "bloc" }, [sectionListe("Adresse illisible", AV.adresses || [], "Aucune.", appelNonRelie)]),
      el("div", { classe: "bloc" }, [sectionListe("Aucun appel trouvé dans le front", AV.routes_sans_appel || [], "Aucune route.", function (id) {
        return [lienRoute(id), el("span", { classe: "note", texte: " · " + ROUTES[id].fichier })];
      })]),
      el("div", { classe: "bloc" }, [sectionListe("Table illisible", AV.tables_illisibles || [], "Aucune.", function (e) {
        return [el("a", { href: "#/fichier/" + e.fichier, texte: e.fichier + ":" + e.ligne })];
      })])
    ];
  }

  function afficher() {
    var h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var vue = document.getElementById("vue");
    var parts;
    if (h.indexOf("fichier/") === 0 && F(h.slice(8))) parts = vueFichier(h.slice(8));
    else if (h.indexOf("route/") === 0 && ROUTES[h.slice(6)]) parts = vueRoute(h.slice(6));
    else if (h.indexOf("table/") === 0 && TABLES[h.slice(6)]) parts = vueTable(h.slice(6));
    else if (h === "routes") parts = vueRoutes();
    else if (h === "tables") parts = vueTables();
    else if (h === "a-verifier") parts = vueAVerifier();
    else if (h.indexOf("systeme/") === 0 && parId[h.slice(8)]) parts = vueSysteme(parId[h.slice(8)]);
    else parts = vueCarte();
    vue.textContent = "";
    champ.value = "";
    resultats.textContent = "";
    parts.forEach(function (p) { vue.appendChild(p); });
    window.scrollTo(0, 0);
  }

  var champ = document.getElementById("champ");
  var resultats = document.getElementById("resultats");
  function chercher() {
    var q = champ.value.trim().toLowerCase();
    resultats.textContent = "";
    if (!q) return;
    var trouves = [];
    Object.keys(D.fichiers).concat(Object.keys(FRONT)).sort().forEach(function (c) {
      if (c.toLowerCase().indexOf(q) !== -1 || F(c).phrase.toLowerCase().indexOf(q) !== -1)
        trouves.push({ lien: lienFichier(c), nom: c, note: F(c).phrase });
    });
    Object.keys(ROUTES).sort().forEach(function (id) {
      if (id.toLowerCase().indexOf(q) !== -1)
        trouves.push({ lien: lienRoute(id), nom: id, note: "Route · " + ROUTES[id].fichier });
    });
    Object.keys(TABLES).sort().forEach(function (n) {
      if (n.toLowerCase().indexOf(q) !== -1) trouves.push({ lien: lienTable(n), nom: n, note: "Table" });
    });
    trouves.slice(0, 40).forEach(function (r) {
      r.lien.appendChild(el("small", { texte: r.note, "aria-hidden": "true" }));
      r.lien.setAttribute("aria-label", r.nom);
      resultats.appendChild(el("li", {}, [r.lien]));
    });
  }
  champ.addEventListener("input", chercher);
  champ.addEventListener("keydown", function (e) {
    var premier = resultats.querySelector("a");
    if (e.key === "Enter" && premier) { location.hash = premier.getAttribute("href"); }
    if (e.key === "Escape") { champ.value = ""; chercher(); }
  });

  document.getElementById("meta").textContent =
    "Générée le " + D.genere_le + " · commit " + D.commit + " · " +
    pluriel(Object.keys(D.fichiers).length, "fichier") + " · " + pluriel(systemes.length, "système") +
    " · " + pluriel(Object.keys(FRONT).length, "écran") + " · " + pluriel(Object.keys(ROUTES).length, "route") +
    " · " + pluriel(Object.keys(TABLES).length, "table");
  window.addEventListener("hashchange", afficher);
  afficher();
})();
</script>
</body>
</html>
