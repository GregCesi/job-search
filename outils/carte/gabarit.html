<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte du code — job-search</title>
<link rel="icon" href="data:,">
<!-- Gabarit de la carte du code (EXE-216). python -m outils.carte en tire
     docs/carte/index.html : les données remplacent la marque du bloc « donnees ».
     La forme (dessin à quatre niveaux, panneau, parcours) reprend la carte du
     code de Xéros, du même auteur. -->
<style>
:root {
  --fond: #f6f3ec; --papier: #fffdf8; --encre: #22201c; --doux: #6b655b; --trait: #ddd6c8;
  --accent: #b5521b; --accent-doux: #f6e3d6; --lien: #1f5f8b; --alerte: #a2471b;
  --l: 92%; --s: 52%; --lb: 42%;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fond: #1b1a18; --papier: #24221f; --encre: #ece8df; --doux: #a29c90; --trait: #3c3934;
    --accent: #e98a4f; --accent-doux: #3e2a1e; --lien: #8db8e6; --alerte: #e98a4f;
    --l: 24%; --s: 32%; --lb: 62%;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 20px; border-bottom: 1px solid var(--trait); background: var(--papier); }
header h1 { font-size: 18px; margin: 0; font-weight: 650; }
nav.onglets { display: flex; gap: 4px; flex-wrap: wrap; }
nav.onglets a { padding: 5px 12px; border-radius: 6px; color: var(--encre); text-decoration: none; }
nav.onglets a:hover { background: var(--fond); }
nav.onglets a.actif { background: var(--accent-doux); color: var(--accent); font-weight: 600; }
#recherche { margin-left: auto; position: relative; }
#recherche input { width: 320px; max-width: 80vw; padding: 6px 10px; font: inherit; font-size: 14px; border: 1px solid var(--trait); border-radius: 6px; background: var(--fond); color: var(--encre); }
#resultats { position: absolute; right: 0; top: 100%; z-index: 5; margin: 4px 0 0; padding: 4px 0; width: 460px; max-width: 90vw; max-height: 60vh; overflow: auto; list-style: none; background: var(--papier); border: 1px solid var(--trait); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
#resultats:empty { display: none; }
#resultats li a { display: block; padding: 5px 12px; font-family: var(--mono); font-size: 13px; color: var(--lien); text-decoration: none; }
#resultats li a:hover, #resultats li a:focus { background: var(--accent-doux); }
#resultats small { display: block; color: var(--doux); font-family: system-ui, sans-serif; }
nav.ariane { padding: 10px 20px 0; font-size: 14px; color: var(--doux); }
nav.ariane a { color: var(--lien); text-decoration: none; }
nav.ariane a:hover { text-decoration: underline; }
nav.ariane a.ici { color: var(--encre); font-weight: 600; }
nav.ariane .sep { color: var(--trait); margin: 0 4px; }
nav.ariane .niveau { margin-left: 8px; }
#parcours-barre { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 20px; font-size: 14px; }
#parcours-barre .titre { color: var(--doux); margin-right: 4px; }
button { font: inherit; font-size: 13px; padding: 4px 11px; border: 1px solid var(--trait); background: var(--papier); color: var(--encre); border-radius: 999px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
button.actif { background: var(--accent); color: #fff; border-color: var(--accent); }
#etape { margin: 0 20px 6px; padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--accent-doux); border-radius: 6px; }
#etape .ligne { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#etape .num { font-weight: 700; color: var(--accent); }
#etape .boutons { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
#etape .phrase-etape { margin: 6px 0 0; font-size: 15.5px; }
#etape .couche-etape, #etape .regle, #etape .fonction { color: var(--doux); font-size: 13px; }
#etape .regle { margin: 4px 0 0; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 10px 20px 30px; align-items: start; }
main.page-seule { display: block; }
#dessin { background: var(--papier); border: 1px solid var(--trait); border-radius: 10px; padding: 10px; overflow: auto; min-height: 300px; }
#dessin svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
#panneau { background: var(--papier); border: 1px solid var(--trait); border-radius: 10px; padding: 16px 18px; position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; }
#panneau h2, .page h2 { font-size: 17px; margin: 0 0 6px; }
#panneau h2.chemin, #panneau h2.route, #panneau h2.table { font-family: var(--mono); font-size: 14px; word-break: break-all; }
#panneau h3, .page h3 { font-size: 13px; letter-spacing: .03em; color: var(--doux); margin: 14px 0 4px; font-weight: 650; }
#panneau ul, #panneau ol, .page ul, .page ol { margin: 0; padding-left: 18px; }
#panneau li, .page li { margin: 2px 0; }
#panneau p { margin: 4px 0; }
a { color: var(--lien); text-decoration: none; }
a:hover { text-decoration: underline; }
a.f, code, .f, .route-id { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.discret, .note, .compte, .lignes, .couche, .appels-base, .systeme-du-fichier, .servie-par, .acces-base, .methode, .chemin-route { color: var(--doux); font-size: 13px; }
.sans-phrase { color: var(--alerte); }
.non-relie { color: var(--alerte); font-size: 13px; }
.vide { color: var(--doux); font-size: 13px; margin: 0; }
.ecrivains { font-size: 15px; margin: 6px 0; }
.total-base { font-size: 15px; }
.pastille { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; border: 1px solid hsl(var(--h) 45% var(--lb)); background: hsl(var(--h) var(--s) var(--l)); }
.legende { font-size: 12.5px; color: var(--doux); margin-top: 8px; }
.legende span { white-space: nowrap; margin-right: 12px; }
.legende i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 4px; }
ol.etapes-parcours li { margin: 8px 0; cursor: pointer; }
ol.etapes-parcours li.courante { font-weight: 700; }
ol.etapes-parcours li.a-venir { opacity: .6; }
.page { background: var(--papier); border: 1px solid var(--trait); border-radius: 10px; padding: 20px 26px; }
.page section { margin: 18px 0; }
.page ol.base-fichiers li, .page ul.routes li, .page ul.tables li { font-size: 14px; }
.page ul.changements li { font-family: var(--mono); font-size: 13px; }
svg text { fill: var(--encre); font-family: system-ui, -apple-system, sans-serif; }
svg .bloc { outline: none; }
svg .bloc.cliquable { cursor: pointer; }
svg .bloc rect.fond { fill: hsl(var(--h) var(--s) var(--l)); stroke: hsl(var(--h) 45% var(--lb)); stroke-width: 1.5; transition: stroke-width .15s; }
svg .bloc:hover rect.fond, svg .bloc:focus rect.fond { stroke-width: 3; }
svg .bloc.neutre rect.fond { fill: var(--papier); stroke: var(--doux); }
svg .bloc.entree rect.fond { fill: var(--accent-doux); stroke: var(--accent); stroke-width: 2.2; }
svg .bloc.base rect.fond { fill: var(--papier); stroke: var(--doux); stroke-dasharray: 5 3; }
svg .bloc .sous { fill: var(--doux); font-size: 11px; }
svg .bloc.eteint { opacity: .25; }
svg .bloc.vu rect.fond { stroke: var(--accent); stroke-width: 3; }
svg .bloc.courant rect.fond { stroke: var(--accent); stroke-width: 5; filter: drop-shadow(0 0 7px var(--accent)); }
svg path.fl { fill: none; stroke: var(--doux); opacity: .45; }
svg path.fl.sort { stroke: var(--lien); opacity: .95; }
svg path.fl.entre { stroke: var(--accent); opacity: .95; }
svg path.fl.eteinte { opacity: .06; }
svg path.fl.parcours { stroke: var(--accent); opacity: 1; }
svg path.fl.lit { stroke: var(--lien); opacity: .9; stroke-dasharray: 6 4; }
svg path.fl.ecrit { stroke: var(--accent); opacity: .95; }
svg path.zone { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: help; }
svg text.etiq { font-size: 11px; fill: var(--doux); }
svg text.etiq-court { font-size: 12px; fill: var(--lien); font-weight: 600; cursor: help; paint-order: stroke; stroke: var(--papier); stroke-width: 4px; }
svg text.titre-col { font-size: 12px; fill: var(--doux); }
svg .groupe rect.cadre { fill: hsl(var(--h) var(--s) var(--l)); stroke: hsl(var(--h) 45% var(--lb)); stroke-dasharray: 4 3; }
svg .groupe.neutre rect.cadre { fill: var(--papier); stroke: var(--doux); }
svg .groupe .titre-groupe { font-weight: 600; font-size: 12px; cursor: pointer; }
svg .lignef { cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
svg .lignef:hover { fill: var(--lien); text-decoration: underline; }
svg .pastille-base circle { fill: var(--alerte); }
svg .pastille-base text, svg .badge-etape text { fill: #fff; font-size: 11px; font-weight: 700; }
svg .badge-etape rect { fill: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Carte du code de job-search</h1>
  <nav class="onglets" aria-label="Onglets">
    <a href="#/" data-onglet="carte">La carte</a>
    <a href="#/base" data-onglet="base">La base</a>
    <a href="#/a-verifier" data-onglet="a-verifier">À vérifier</a>
    <a href="#/depuis" data-onglet="depuis">Depuis la dernière carte</a>
  </nav>
  <div id="recherche">
    <input type="search" id="champ" aria-label="Rechercher un fichier, un système, une route ou une table"
           placeholder="Rechercher un fichier, un système, une route ou une table" autocomplete="off">
    <ul id="resultats"></ul>
  </div>
</header>
<nav class="ariane" aria-label="Fil d'Ariane"></nav>
<div id="parcours-barre" role="toolbar" aria-label="Suivre un parcours"></div>
<div id="etape" hidden></div>
<main id="principal"></main>
<script id="donnees" type="application/json">__DONNEES__</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("donnees").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const SANS_PHRASE = "Pas de phrase pour ce fichier.";
  const PY = D.fichiers;
  const FRONT = D.fichiers_front || {};
  const ROUTES = D.routes || {};
  const TABLES = D.tables || {};
  const AV = D.a_verifier || {};
  const PARCOURS = D.parcours || [];
  const ENSEMBLE = D.ensemble || { blocs: [], fleches: [] };
  const DEPUIS = D.depuis || { premier: true, changements: [] };
  const POS = D.positions || {};
  const BASE_D = D.base || { hors_stockage: 0, fichiers: [] };
  const autres = { id: D.autres_systeme.id, nom: D.autres_systeme.nom, role: D.autres_systeme.role, fichiers: D.autres };
  const SYSTEMES = (D.ecrans ? [D.ecrans] : []).concat(D.systemes, D.autres.length ? [autres] : []);
  const SYS = {};
  SYSTEMES.forEach((s, i) => { SYS[s.id] = s; s.h = Math.round((i * 360) / SYSTEMES.length + 20) % 360; });
  if (!SYS[autres.id]) { SYS[autres.id] = autres; autres.h = 20; }
  const blocBase = ENSEMBLE.blocs.find((b) => b.id === "base");
  const BASE = { id: "base", nom: blocBase ? blocBase.nom : "Base", role: blocBase ? blocBase.role : "La base SQLite.", fichiers: [] };
  const F = (c) => PY[c] || FRONT[c];
  const nomCourt = (c) => c.split("/").pop();
  const dossier = (c) => c.replace(/[^/]+$/, "");
  const pluriel = (n, mot, pl) => n + " " + (n === 1 ? mot : (pl || mot + "s"));
  const compteAppels = (n) => n + (n === 1 ? " appel direct" : " appels directs");
  const etat = { parcours: null, etape: 0, lecture: null };
  const parcoursActif = () => (etat.parcours ? PARCOURS.find((p) => p.id === etat.parcours) : null);

  // ---------- liens entre fichiers ----------
  const utilisePar = {};
  Object.keys(FRONT).forEach((c) => { utilisePar[c] = []; });
  function utilise(c) {
    if (PY[c]) return PY[c].importe;
    const f = FRONT[c];
    return f.stores.concat(f.composants).filter((x, i, a) => FRONT[x] && x !== c && a.indexOf(x) === i);
  }
  Object.keys(FRONT).forEach((c) => utilise(c).forEach((u) => utilisePar[u].push(c)));
  const importeurs = (c) => (PY[c] ? PY[c].importe_par : utilisePar[c].slice().sort());
  const routesDuSysteme = (s) => s.fichiers.reduce((a, c) => a.concat(F(c).routes || []), []).filter((x, i, a) => a.indexOf(x) === i);

  // Flèches entre systèmes : imports (relevé) et appels du front vers les routes d'un système.
  const FLECHES_SYS = D.fleches.map((f) => ({ de: f.de, vers: f.vers, n: f.n, sorte: "import" }));
  (function () {
    const appels = {};
    Object.keys(FRONT).forEach((c) => FRONT[c].routes.forEach((r) => {
      const s = PY[ROUTES[r].fichier].systeme;
      appels[s] = (appels[s] || 0) + 1;
    }));
    Object.keys(appels).sort().forEach((s) => FLECHES_SYS.push({ de: "ecrans", vers: s, n: appels[s], sorte: "appel" }));
  })();
  const decompte = (e) => (e.sorte === "appel" ? pluriel(e.n, "appel") + " à ses routes" : pluriel(e.n, "import"));

  // ---------- petits outils SVG (forme reprise du modèle de Xéros) ----------
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach((k) => { if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(e);
    return e;
  }
  function couper(t, max) {
    const lignes = []; let l = "";
    for (const m of String(t).split(" ")) { if ((l + " " + m).trim().length > max && l) { lignes.push(l); l = m; } else l = (l + " " + m).trim(); }
    if (l) lignes.push(l);
    return lignes;
  }
  function texte(g, x, y, lignes, attrs, pas) {
    const t = el("text", Object.assign({ x: x, y: y, "text-anchor": "middle" }, attrs || {}), g);
    lignes.forEach((l, i) => { const s = el("tspan", { x: x, dy: i ? (pas || 16) : 0 }, t); s.textContent = l; });
    return t;
  }
  const centre = (r) => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });
  function bord(r, vers) {
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2, dx = vers.x - cx, dy = vers.y - cy;
    if (!dx && !dy) return { x: cx, y: cy };
    const t = Math.min(Math.abs(r.w / 2 / (dx || 1e-9)), Math.abs(r.h / 2 / (dy || 1e-9)));
    return { x: cx + dx * t, y: cy + dy * t };
  }
  const MARQUES = { sort: "pointe-s", entre: "pointe-e", parcours: "pointe-e", ecrit: "pointe-e", lit: "pointe-s" };
  function fleche(svg, a, b, o) {
    o = o || {};
    const p1 = bord(a, centre(b)), p2 = bord(b, centre(a));
    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1, dec = o.decale || 0;
    const cx = (p1.x + p2.x) / 2 - (dy / len) * dec, cy = (p1.y + p2.y) / 2 + (dx / len) * dec;
    const d = "M" + p1.x + "," + p1.y + " Q" + cx + "," + cy + " " + p2.x + "," + p2.y;
    const classe = o.classe || "";
    const t = el("path", { d: d, class: "fl " + classe, "stroke-width": o.epais || 1.6, "marker-end": "url(#" + (MARQUES[classe] || "pointe") + ")",
      "data-de": o.de, "data-vers": o.vers, "data-n": o.n }, svg);
    const mx = (p1.x + 2 * cx + p2.x) / 4, my = (p1.y + 2 * cy + p2.y) / 4;
    let etiq = null, zone = null;
    if (o.zone) zone = el("path", { d: d, class: "zone", "data-de": o.de, "data-vers": o.vers }, svg);
    if (o.etiquette) {
      etiq = el("text", { x: mx, y: my - 6, "text-anchor": "middle", class: o.classeEtiquette || "etiq", "data-de": o.de, "data-vers": o.vers }, svg);
      etiq.textContent = o.etiquette;
    }
    if (o.titre) el("title", {}, t).textContent = o.titre;
    return { t: t, etiq: etiq, zone: zone };
  }
  function nouveauSvg(w, h, nom) {
    const svg = el("svg", { viewBox: "0 0 " + w + " " + h, width: w, height: h, role: "img", "aria-label": nom, "data-dessin": nom });
    const defs = el("defs", {}, svg);
    [["pointe", "var(--doux)"], ["pointe-s", "var(--lien)"], ["pointe-e", "var(--accent)"]].forEach((m) => {
      const mk = el("marker", { id: m[0], viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
      el("path", { d: "M0,0 L10,5 L0,10 z", style: "fill:" + m[1] }, mk);
    });
    return svg;
  }
  function bloc(svg, r, o) {
    const attrs = Object.assign({ class: "bloc " + (o.clic ? "cliquable " : "") + (o.classe || ""), style: o.h !== undefined ? "--h:" + o.h : "", tabindex: o.clic ? 0 : null }, o.attrs || {});
    const g = el("g", attrs, svg);
    el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 8, class: "fond" }, g);
    const lignes = couper(o.nom, o.max || 24);
    const sous = o.sous ? [].concat(o.sous) : [];
    const haut = lignes.length * 16 + sous.length * 15;
    const y = r.y + r.h / 2 - haut / 2 + 12;
    const titre = texte(g, r.x + r.w / 2, y, lignes, { "font-weight": 600, "font-size": o.taille || 13.5, class: "nom" });
    titre.setAttribute("data-nom", o.nom);
    sous.forEach((s, i) => texte(g, r.x + r.w / 2, y + lignes.length * 16 + i * 15 + 1, [s], { class: "sous" }));
    if (o.clic) { g.addEventListener("click", o.clic); g.addEventListener("keydown", (e) => { if (e.key === "Enter") o.clic(); }); }
    if (o.survol) { g.addEventListener("mouseenter", () => o.survol(true)); g.addEventListener("mouseleave", () => o.survol(false)); }
    return g;
  }
  function badge(svg, x, y, txt) {
    const g = el("g", { class: "badge-etape", "data-etapes": txt }, svg);
    const w = Math.max(20, txt.length * 7 + 10);
    el("rect", { x: x - w / 2, y: y - 10, width: w, height: 20, rx: 10 }, g);
    texte(g, x, y + 4, [txt]);
    return g;
  }
  function pastilleBase(g, r, n) {
    const p = el("g", { class: "pastille-base", "data-appels": n }, g);
    el("circle", { cx: r.x + 4, cy: r.y + 4, r: 11 }, p);
    texte(p, r.x + 4, r.y + 8, [String(n)]);
    el("title", {}, p).textContent = compteAppels(n) + " à la base";
  }
  function allumer(traits, sur) {
    traits.forEach((x) => {
      const c = sur ? sur(x.e) : "";
      x.t.setAttribute("class", "fl " + c + (x.extra ? " " + x.extra : ""));
      x.t.setAttribute("marker-end", "url(#" + (MARQUES[c] || "pointe") + ")");
    });
  }
  function grille(liste, cle) { // place [colonne, ligne] de chaque élément ; un élément sans place prend la première libre
    const prises = {}, place = {};
    liste.forEach((x) => { const p = cle(x); if (p) { place[x.id] = p; prises[p[0] + "," + p[1]] = true; } });
    const cols = Math.max(4, ...Object.values(place).map((p) => p[0] + 1));
    let i = 0;
    liste.forEach((x) => {
      if (place[x.id]) return;
      while (prises[(i % cols) + "," + Math.floor(i / cols)]) i++;
      place[x.id] = [i % cols, Math.floor(i / cols)]; prises[(i % cols) + "," + Math.floor(i / cols)] = true;
    });
    return place;
  }

  // ---------- liens du panneau ----------
  const aller = (h) => { location.hash = h; };
  const hrefF = (c) => "#/fichier/" + c;
  const hrefR = (id) => "#/route/" + encodeURIComponent(id);
  const hrefT = (n) => "#/table/" + encodeURIComponent(n);
  const hrefS = (id) => "#/systeme/" + encodeURIComponent(id);
  const lienF = (c) => '<a class="f" href="' + esc(hrefF(c)) + '">' + esc(c) + "</a>";
  const lienR = (id) => '<a class="f" href="' + esc(hrefR(id)) + '">' + esc(id) + "</a>";
  const lienT = (n) => '<a class="f" href="' + esc(hrefT(n)) + '">' + esc(n) + "</a>";
  const lienS = (id) => '<a href="' + esc(hrefS(id)) + '"><span class="pastille" style="--h:' + SYS[id].h + '"></span>' + esc(SYS[id].nom) + "</a>";
  function section(titre, items, vide, rendu, classe) {

  function ariane(r) {

  // ---------- niveau 1 : la vue d'ensemble ----------
  function nomBloc(id) { const b = ENSEMBLE.blocs.find((x) => x.id === id); return b ? b.nom : id; }
  function sousBloc(b) {

  function niveau1() {

      const x = fleche(svg, pos[f.de], pos[f.vers], { de: f.de, vers: f.vers, decale: dec, classe: "sort", epais: 2, zone: true,
        etiquette: f.court || f.libelle, classeEtiquette: "etiq-court" });

  // ---------- niveau 2 : les systèmes ----------
  function etapeSysteme(st) {

          panneau(on ? { niveau: 2, survol: s.id } : lireAncre());

    });

      for (let i = 1; i <= etat.etape; i++) {
        const a = etapeSysteme(p.etapes[i - 1]), b = etapeSysteme(p.etapes[i]);
        if (a !== b) fleche(svg, pos[a], pos[b], { de: a, vers: b, classe: "parcours", epais: i === etat.etape ? 4 : 2.2, decale: 24 });

  function panneauSysteme(s) {

  function panneauN2(r) {

  // ---------- niveau 2 bis : les tables ----------

  function dessinTables() {

    noms.forEach((n, i) => {

        ", écrite par " + esc(pluriel(TABLES[n].ecrite_par.length, "fichier")) + "</span></li>").join("") + "</ul>";
  }

  // ---------- niveau 3 : un système ----------
  function niveau3(r) {
    const s = SYS[r.sys];
    const dans = new Set(s.fichiers), prof = {};
    const calc = (f, chemin) => {
      if (prof[f] !== undefined) return prof[f];
      if (chemin.has(f)) return 0;
      chemin.add(f);
      let d = 0;
      utilise(f).forEach((u) => { if (dans.has(u)) d = Math.max(d, 1 + calc(u, chemin)); });
      chemin.delete(f);
      return (prof[f] = d);
    };
    s.fichiers.forEach((f) => calc(f, new Set()));
    const max = Math.max(0, ...Object.values(prof)), rangs = [];
    s.fichiers.forEach((f) => { (rangs[max - prof[f]] = rangs[max - prof[f]] || []).push(f); });
    const PAR = 4, W = 176, H = 66, GX = 26, GY = 50, COTE = 190, lignes = [];
    rangs.filter(Boolean).forEach((rg) => { for (let i = 0; i < rg.length; i += PAR) lignes.push(rg.slice(i, i + PAR)); });
    const larg = PAR * W + (PAR - 1) * GX, pos = {};

      const items = {};
      l.forEach((e, i) => {
        const id = e[autre];
        items[id] = bloc(svg, { x: x, y: 36 + i * 34, w: COTE, h: 26 }, { nom: SYS[id].nom + " (" + e.n + ")", h: SYS[id].h, taille: 11, max: 60,
          attrs: { "data-voisin": id, "data-cote": cote, "data-n": e.n }, clic: () => aller(hrefS(id)) });

    }));

    if (p) p.etapes.forEach((st, i) => { if (st.genre === "fichier" && dans.has(st.element) && i <= etat.etape) (numeros[st.element] = numeros[st.element] || []).push(i + 1); });
    const courant = p && p.etapes[etat.etape].genre === "fichier" ? p.etapes[etat.etape].element : null;

        attrs: { "data-fichier": f, "data-couche": couche },
        classe: p ? (f === courant ? "courant" : numeros[f] ? "vu" : "") : "",
        clic: () => aller(hrefF(f)),
        survol: (on) => {
          allumer(traits, on ? (e) => (e.de === f ? "sort" : e.vers === f ? "entre" : "eteinte") : null);
          const touche = new Set(utilise(f).concat(importeurs(f)).map((u) => F(u).systeme));
          Object.keys(gauche).concat(Object.keys(droite)).forEach((id) => {
            [gauche[id], droite[id]].forEach((x) => { if (x) x.classList.toggle("eteint", on && !touche.has(id)); });
          });

  function panneauN3(r) {

  // ---------- niveau 4 : un fichier, une route, une table ----------
  function grouper(chemins) {

  function dessinTrois(o) {

    if (o.gauche.length) el("text", { x: xg + GW / 2, y: 22, "text-anchor": "middle", class: "titre-col" }, svg).textContent = o.titreG;
    if (o.droite.length) el("text", { x: xd + GW / 2, y: 22, "text-anchor": "middle", class: "titre-col" }, svg).textContent = o.titreD;
    const poser = (gs, x, cote) => {
      let y = 36;
      gs.forEach((g) => {
        const rr = { x: x, y: y, w: GW, h: hg(g) };
        y += hg(g) + GAP;
        const grp = el("g", Object.assign({ class: "groupe" + (g.h === undefined ? " neutre" : ""), style: g.h !== undefined ? "--h:" + g.h : "", "data-cote": cote }, g.attrs || {}), svg);
        el("rect", { x: rr.x, y: rr.y, width: rr.w, height: rr.h, rx: 8, class: "cadre" }, grp);
        const tt = el("text", { x: rr.x + 10, y: rr.y + 19, class: "titre-groupe" }, grp);
        tt.textContent = g.titre;
        if (g.lienTitre) { tt.setAttribute("data-lien", g.lienTitre); tt.addEventListener("click", () => aller(g.lienTitre)); }
        g.items.forEach((it, i) => {
          const t = el("text", Object.assign({ x: rr.x + 14, y: rr.y + 38 + i * LH, class: "lignef", "data-lien": it.lien }, it.attrs || {}), grp);
          t.textContent = it.nom;
          if (it.titre) el("title", {}, t).textContent = it.titre;
          if (it.lien) t.addEventListener("click", () => aller(it.lien));
        });
        const n = g.items.length, lab = g.etiquette !== undefined ? g.etiquette : String(n);
        const attrsF = { etiquette: lab, epais: 1.8 };
        if (cote === "gauche") fleche(svg, rr, rc, Object.assign(attrsF, { classe: g.classe || "entre", de: g.titre, vers: "centre" }));
        else fleche(svg, rc, rr, Object.assign(attrsF, { classe: g.classe || "sort", de: "centre", vers: g.titre }));
      });
    };
    poser(o.gauche, xg, "gauche");
    poser(o.droite, xd, "droite");
    const c = o.centre;
    bloc(svg, rc, { nom: c.nom, sous: c.sous, h: c.h, classe: (c.h === undefined ? "neutre " : "") + "vu centre", max: 28, taille: 14, attrs: Object.assign({ "data-centre": c.nom }, c.attrs || {}) });
    return svg;
  }
  function groupeListe(titre, sorte, items, classe, etiquette, lienTitre) {
    return { titre: titre, sorte: sorte, items: items, classe: classe, etiquette: etiquette, lienTitre: lienTitre, attrs: { "data-groupe": sorte } };
  }
  function niveau4Fichier(c) {
    const info = F(c), s = SYS[info.systeme];
    const gauche = grouper(importeurs(c)), droite = grouper(utilise(c));
    const tab = (n) => ({ nom: n, lien: hrefT(n), attrs: { "data-table": n } });
    const rte = (id) => ({ nom: id, lien: hrefR(id), attrs: { "data-route": id } });
    if (PY[c]) {
      if (info.routes.length) gauche.push(groupeListe("Routes qu'il sert", "routes-servies", info.routes.map(rte), "entre", ""));
      if (info.tables_lues.length) gauche.push(groupeListe("Tables qu'il lit", "tables-lues", info.tables_lues.map((n) => Object.assign(tab(n), { attrs: { "data-table": n, "data-acces": "lit" } })), "lit", "lit", "#/tables"));
      if (info.tables_ecrites.length) droite.push(groupeListe("Tables qu'il écrit", "tables-ecrites", info.tables_ecrites.map((n) => Object.assign(tab(n), { attrs: { "data-table": n, "data-acces": "ecrit" } })), "ecrit", "écrit", "#/tables"));
    } else if (info.routes.length) {
      droite.push(groupeListe("Routes qu'il appelle", "routes-appelees", info.routes.map(rte), "sort", "appelle"));
    }
    const p = parcoursActif();
    const estCourant = p && p.etapes[etat.etape].element === c;
    return dessinTrois({ nom: "le fichier " + c, gauche: gauche, droite: droite,
      titreG: "← ce qui entre : " + pluriel(importeurs(c).length, "importeur"), titreD: "ce qu'il utilise : " + pluriel(utilise(c).length, "fichier") + " →",
      centre: { nom: nomCourt(c), sous: [info.lignes + " lignes · " + (info.couche || "écran"), s.nom], h: s.h, attrs: { "data-fichier": c, class: "bloc vu centre" + (estCourant ? " courant" : "") } } });
  }
  function niveau4Route(id) {
    const r = ROUTES[id], sf = SYS[PY[r.fichier].systeme];
    const gauche = r.appelee_par.length ? grouper(r.appelee_par) : [groupeListe("Aucun appel trouvé dans le front.", "sans-appel", [], "entre", "")];
    gauche.forEach((g) => { if (g.sorte === "systeme") g.etiquette = "appelle"; });
    const droite = [{ titre: sf.nom, h: sf.h, lienTitre: hrefS(sf.id), sorte: "systeme", etiquette: "servie par", attrs: { "data-groupe-systeme": sf.id },
      items: [{ nom: nomCourt(r.fichier), lien: hrefF(r.fichier), titre: r.fichier, attrs: { "data-fichier": r.fichier } }] }];
    return dessinTrois({ nom: "la route " + id, gauche: gauche, droite: droite, titreG: "← les écrans qui l'appellent", titreD: "le fichier qui la sert →",
      centre: { nom: id, sous: ["fonction " + r.fonction, "accès à la base : " + r.base], attrs: { "data-route": id } } });
  }
  function niveau4Table(n) {
    const t = TABLES[n];
    const gauche = grouper(t.lue_par), droite = grouper(t.ecrite_par);
    gauche.forEach((g) => { g.classe = "lit"; g.etiquette = "lit"; });
    droite.forEach((g) => { g.classe = "ecrit"; g.etiquette = "écrit"; });
    const nb = systemesEcrivains(n).length;
    return dessinTrois({ nom: "la table " + n, gauche: gauche, droite: droite, titreG: "← les fichiers qui la lisent", titreD: "les fichiers qui l'écrivent →",
      centre: { nom: n, sous: [phraseEcrivains(nb)], attrs: { "data-table": n } } });
  }

  function etatAppel(a) {
    if (!a.lisible) return '<span class="non-relie"> · adresse illisible</span>';
    if (!a.routes.length) return '<span class="non-relie"> · appel sans route trouvée</span>';
    return a.routes.map((id) => " → " + lienR(id)).join("");
  }
  function parcoursDuFichier(c) {
    const items = [];
    PARCOURS.forEach((p) => {
      for (let i = 0; i < p.etapes.length; i++) {
        const e = p.etapes[i];
        if (e.genre === "fichier" && e.element === c) { items.push({ p: p, n: i + 1 }); break; }
      }
    });
    return section("Parcours qui passent par lui", items, "Aucun parcours ne passe par lui.", (x) => '<a href="#/parcours/' + esc(x.p.id) + "/" + x.n + '">' + esc(x.p.nom) + '</a><span class="note"> · étape ' + x.n + "</span>", "parcours-du-fichier");
  }
  function panneauFichier(c) {
    const f = F(c), s = SYS[f.systeme];
    let h = '<h2 class="chemin">' + esc(c) + '</h2><p class="phrase' + (f.phrase === SANS_PHRASE ? " sans-phrase" : "") + '">' + esc(f.phrase) + "</p>" +
      '<p class="lignes">' + esc(pluriel(f.lignes, "ligne")) + '</p><p class="systeme-du-fichier">Système : ' + lienS(s.id) + "</p>";
    if (FRONT[c]) {
      return h + parcoursDuFichier(c) +
        section("Routes qu'il appelle", f.routes, "Il n'appelle aucune route de la carte.", lienR) +
        section("Stores qu'il importe", f.stores, "Il n'importe aucun store.", lienF) +
        section("Composants qu'il utilise", f.composants, "Il n'utilise aucun composant.", lienF) +
        section("Qui l'utilise", utilisePar[c], "Aucun fichier du front ne l'utilise.", lienF) +
        section("Ses appels à l'API", f.appels, "Aucun appel à l'API dans ce fichier.", (a) => '<span class="route-id">' + esc(a.methode + " " + a.adresse) + '</span><span class="note"> · ligne ' + a.ligne + "</span>" + etatAppel(a));
    }
    if (f.couche !== undefined) {
      h += '<p class="couche">Couche : ' + esc(f.couche) + '</p><p class="appels-base">Appels directs à la base : ' + f.appels_base + "</p>" +
        section("Routes qu'il déclare", f.routes, "Il ne déclare aucune route.", (id) => lienR(id) + '<span class="note"> · ' + esc(ROUTES[id].fonction) + "</span>") +
        section("Tables qu'il lit", f.tables_lues, "Il ne lit aucune table.", lienT) +
        section("Tables qu'il écrit", f.tables_ecrites, "Il n'écrit aucune table.", lienT);
    }
    return h + parcoursDuFichier(c) +
      section("Ce qu'il importe", f.importe, "Il n'importe aucun fichier de la carte.", lienF) +
      section("Qui l'importe", f.importe_par, "Aucun fichier de la carte ne l'importe.", lienF) +
      section("Les tests qui l'importent", f.tests, "Aucun test ne l'importe directement.", (t) => '<span class="test f">' + esc(t) + "</span>");
  }
  function panneauRoute(id) {
    const r = ROUTES[id];
    return '<h2 class="route">' + esc(id) + '</h2><p class="methode">Méthode : ' + esc(r.methode) + '</p><p class="chemin-route">Chemin : <code>' + esc(r.chemin) + "</code></p>" +
      '<p class="servie-par">Servie par ' + lienF(r.fichier) + ", fonction " + esc(r.fonction) + " (ligne " + r.ligne + ")</p>" +
      '<p class="acces-base">Accès à la base : ' + esc(r.base) + "</p>" +
      section("Appelée par", r.appelee_par, "Aucun appel trouvé dans le front.", lienF);
  }
  const fichierEtSysteme = (c) => lienF(c) + " · " + lienS(F(c).systeme);
  function panneauTable(n) {
    const t = TABLES[n];
    return '<h2 class="table">' + esc(n) + '</h2><p class="ecrivains">' + esc(phraseEcrivains(systemesEcrivains(n).length)) + "</p>" +
      section("Fichiers qui la lisent", t.lue_par, "Aucun fichier ne la lit.", fichierEtSysteme) +
      section("Fichiers qui l'écrivent", t.ecrite_par, "Aucun fichier ne l'écrit.", fichierEtSysteme);
  }

  // ---------- les parcours ----------
  function barreParcours(r) {
    const b = $("#parcours-barre");
    if (r.page || !PARCOURS.length) { b.innerHTML = ""; b.hidden = true; return; }
    b.hidden = false;
    b.innerHTML = '<span class="titre">Suivre un parcours :</span>' + PARCOURS.map((p) => '<button type="button" data-p="' + esc(p.id) + '" class="' + (etat.parcours === p.id ? "actif" : "") + '">' + esc(p.nom) + "</button>").join("");
    b.querySelectorAll("button").forEach((x) => x.addEventListener("click", () => {
      if (etat.parcours === x.dataset.p) { arreter(); return; }
      arreterLecture(); etat.parcours = x.dataset.p; etat.etape = 0;
      if (location.hash === "#/systemes") rendre(); else aller("#/systemes");
    }));
  }
  function hrefElement(st) { return st.genre === "route" ? hrefR(st.element) : st.genre === "table" ? hrefT(st.element) : hrefF(st.element); }
  function carteEtape(r) {
    const box = $("#etape"), p = parcoursActif();
    if (!p || r.page) { box.hidden = true; box.innerHTML = ""; return; }
    const st = p.etapes[etat.etape], sid = etapeSysteme(st), sys = sid === "base" ? BASE : SYS[sid];
    box.hidden = false;
    box.innerHTML = '<div class="ligne"><span class="num">Étape ' + (etat.etape + 1) + " sur " + p.etapes.length + "</span> · " +
      '<span class="systeme-etape">' + esc(sys.nom) + "</span> · " + '<a class="f element" href="' + esc(hrefElement(st)) + '">' + esc(st.element) + "</a>" +
      (st.fonction ? '<span class="fonction"> · fonction ' + esc(st.fonction) + "</span>" : "") +
      '<span class="boutons"><button type="button" id="avant"' + (etat.etape ? "" : " disabled") + ">Avant</button>" +
      '<button type="button" id="lecture">' + (etat.lecture ? "Pause" : "Lecture") + "</button>" +
      '<button type="button" id="apres"' + (etat.etape < p.etapes.length - 1 ? "" : " disabled") + ">Après</button>" +
      '<button type="button" id="quitter">Quitter</button></span></div>' +
      '<span class="couche-etape">Couche : ' + esc(st.couche) + "</span>" +
      '<p class="phrase-etape">' + esc(st.phrase) + "</p>" + (st.regle ? '<p class="regle">Règle : ' + esc(st.regle) + "</p>" : "");
    $("#avant").onclick = () => { arreterLecture(); pas(-1); };
    $("#apres").onclick = () => { arreterLecture(); pas(1); };
    $("#quitter").onclick = arreter;
    $("#lecture").onclick = () => {
      if (etat.lecture) { arreterLecture(); rendre(); return; }
      if (etat.etape >= p.etapes.length - 1) etat.etape = -1;
      etat.lecture = setInterval(() => {
        const q = parcoursActif();
        if (!q || etat.etape >= q.etapes.length - 1) { arreterLecture(); rendre(); } else pas(1);
      }, 2600);
      pas(1);
    };
  }
  function pas(d) {
    const p = parcoursActif(); if (!p) return;
    etat.etape = Math.max(0, Math.min(p.etapes.length - 1, etat.etape + d));
    rendre();
  }
  function arreterLecture() { if (etat.lecture) clearInterval(etat.lecture); etat.lecture = null; }
  function arreter() { arreterLecture(); etat.parcours = null; etat.etape = 0; rendre(); }
  function panneauParcours(p) {
    return '<h2 class="parcours-nom">' + esc(p.nom) + '</h2><p class="discret">Les systèmes traversés s\'allument un par un ; leur numéro dit à quelle étape. Clique une étape pour y aller, l\'élément de la carte d\'étape pour l\'ouvrir : le parcours reste actif, reviens par « Les systèmes ».</p>' +
      '<ol class="etapes-parcours">' + p.etapes.map((st, i) => '<li data-e="' + i + '" class="' + (i === etat.etape ? "courante" : i > etat.etape ? "a-venir" : "") + '"' + (i === etat.etape ? ' aria-current="step"' : "") + ">" +
        '<span class="f">' + esc(st.element) + '</span><br><span class="discret">' + esc(st.phrase) + "</span></li>").join("") + "</ol>";
  }

  // ---------- les trois autres onglets ----------
  function pageBase() {
    const ids = Object.keys(ROUTES).sort(), noms = Object.keys(TABLES).sort();
    return '<div class="page"><h2>La base</h2><p class="total-base">' + esc(compteAppels(BASE_D.hors_stockage) + " à la base hors stockage, dans " + pluriel(BASE_D.fichiers.length, "fichier")) + "</p>" +
      '<ol class="base-fichiers">' + BASE_D.fichiers.map((cn) => "<li>" + lienF(cn[0]) + '<span class="n note"> · ' + esc(compteAppels(cn[1])) + "</span></li>").join("") + "</ol>" +
      '<section><h3>Les tables (' + noms.length + ')</h3><ul class="tables">' + noms.map((n) => '<li class="table">' + lienT(n) + '<span class="note"> · lue par ' + esc(pluriel(TABLES[n].lue_par.length, "fichier")) + ", écrite par " + esc(pluriel(TABLES[n].ecrite_par.length, "fichier")) + "</span></li>").join("") + "</ul></section>" +
      '<section><h3>Les routes (' + ids.length + ')</h3><ul class="routes">' + ids.map((id) => '<li class="route">' + lienR(id) + '<span class="note"> · ' + esc(ROUTES[id].fichier) + " · accès à la base : " + esc(ROUTES[id].base) + "</span></li>").join("") + "</ul></section></div>";
  }
  const appelNonRelie = (a) => lienF(a.fichier) + '<span class="note"> · ligne ' + a.ligne + ' · </span><span class="route-id">' + esc(a.methode + " " + a.adresse) + "</span>";
  function pageAVerifier() {
    return '<div class="page"><h2>À vérifier</h2><p class="compte">Ce que les règles de lecture de la carte n\'ont pas su relier.</p>' +
      section("Appel sans route trouvée", AV.appels_sans_route || [], "Aucun.", appelNonRelie) +
      section("Adresse illisible", AV.adresses || [], "Aucune.", appelNonRelie) +
      section("Aucun appel trouvé dans le front", AV.routes_sans_appel || [], "Aucune route.", (id) => lienR(id) + '<span class="note"> · ' + esc(ROUTES[id].fichier) + "</span>") +
      section("Table illisible", AV.tables_illisibles || [], "Aucune.", (e) => '<a class="f" href="' + esc(hrefF(e.fichier)) + '">' + esc(e.fichier + ":" + e.ligne) + "</a>") + "</div>";
  }
  function pageDepuis() {
    let corps;
    if (DEPUIS.premier) corps = '<p class="depuis-etat">Premier relevé.</p>';
    else if (!DEPUIS.changements.length) corps = '<p class="depuis-etat">Rien n\'a changé depuis la dernière carte.</p>';
    else corps = '<ul class="changements">' + DEPUIS.changements.map((c) => "<li>" + liensDansChangement(c) + "</li>").join("") + "</ul>";
    return '<div class="page"><h2>Depuis la dernière carte</h2>' + corps + "</div>";
  }
  function liensDansChangement(ligne) {
    return esc(ligne).replace(/(?:api|orchestrator|web)\/[^\s:→]+/g, (c) => (F(c) ? '<a href="' + esc(hrefF(c)) + '">' + c + "</a>" : c));
  }

  // ---------- le rendu ----------
  function panneau(r) {
    const box = $("#panneau"); if (!box) return;
    const p = parcoursActif();
    if (p && r.niveau === 2 && !r.tables) box.innerHTML = panneauParcours(p);
    else if (r.niveau === 1) box.innerHTML = panneauN1(r);
    else if (r.tables) box.innerHTML = panneauTables();
    else if (r.niveau === 2) box.innerHTML = panneauN2(r);
    else if (r.table) box.innerHTML = panneauTable(r.table);
    else if (r.niveau === 3) box.innerHTML = panneauN3(r);
    else if (r.route) box.innerHTML = panneauRoute(r.route);
    else if (r.fichier) box.innerHTML = panneauFichier(r.fichier);
    box.setAttribute("data-vue", r.fleche ? "fleche" : r.bloc ? "bloc" : r.survol ? "survol" : "repos");
    box.querySelectorAll("[data-e]").forEach((li) => li.addEventListener("click", () => { arreterLecture(); etat.etape = +li.dataset.e; rendre(); }));
  }
  function rendre() {
    const r = lireAncre();
    document.querySelectorAll("nav.onglets a").forEach((a) => {
      const actif = (r.page || "carte") === a.dataset.onglet;
      a.classList.toggle("actif", actif);
      if (actif) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    ariane(r); barreParcours(r); carteEtape(r);
    const main = $("#principal");
    champ.value = ""; resultats.textContent = "";
    if (r.page) {
      main.className = "page-seule";
      main.innerHTML = r.page === "base" ? pageBase() : r.page === "a-verifier" ? pageAVerifier() : pageDepuis();
      return;
    }
    main.className = "";
    if (!$("#dessin")) main.innerHTML = '<div id="dessin"></div><aside id="panneau" aria-label="Panneau"></aside>';
    const svg = r.niveau === 1 ? niveau1() : r.tables ? dessinTables() : r.niveau === 2 ? niveau2() : r.table ? niveau4Table(r.table)
      : r.niveau === 3 ? niveau3(r) : r.route ? niveau4Route(r.route) : niveau4Fichier(r.fichier);
    const d = $("#dessin");
    d.innerHTML = "";
    d.setAttribute("data-niveau", r.niveau);
    d.appendChild(svg);
    panneau(r);
  }

  // ---------- la recherche ----------
  const champ = document.getElementById("champ");
  const resultats = document.getElementById("resultats");
  function chercher() {
    const q = champ.value.trim().toLowerCase();
    resultats.textContent = "";
    if (!q) return;
    const trouves = [];
    SYSTEMES.forEach((s) => { if (s.nom.toLowerCase().indexOf(q) !== -1) trouves.push({ href: hrefS(s.id), nom: s.nom, note: "Système · " + pluriel(s.fichiers.length, "fichier") }); });
    Object.keys(PY).concat(Object.keys(FRONT)).sort().forEach((c) => {
      if (c.toLowerCase().indexOf(q) !== -1 || F(c).phrase.toLowerCase().indexOf(q) !== -1) trouves.push({ href: hrefF(c), nom: c, note: F(c).phrase });
    });
    Object.keys(ROUTES).sort().forEach((id) => { if (id.toLowerCase().indexOf(q) !== -1) trouves.push({ href: hrefR(id), nom: id, note: "Route · " + ROUTES[id].fichier }); });
    Object.keys(TABLES).sort().forEach((n) => { if (n.toLowerCase().indexOf(q) !== -1) trouves.push({ href: hrefT(n), nom: n, note: "Table" }); });
    trouves.slice(0, 40).forEach((x) => {
      const li = document.createElement("li"), a = document.createElement("a"), small = document.createElement("small");
      a.href = x.href; a.textContent = x.nom; a.setAttribute("aria-label", x.nom);
      small.textContent = x.note; small.setAttribute("aria-hidden", "true");
      a.appendChild(small); li.appendChild(a); resultats.appendChild(li);
    });
  }
  champ.addEventListener("input", chercher);
  champ.addEventListener("keydown", (e) => {
    const premier = resultats.querySelector("a");
    if (e.key === "Enter" && premier) location.hash = premier.getAttribute("href");
    if (e.key === "Escape") { champ.value = ""; chercher(); }
  });

  window.addEventListener("hashchange", () => { arreterLecture(); rendre(); });
  document.addEventListener("keydown", (e) => {
    if (!etat.parcours || e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") { arreterLecture(); pas(1); }
    if (e.key === "ArrowLeft") { arreterLecture(); pas(-1); }
    if (e.key === "Escape") arreter();
  });
  rendre();
})();
</script>
</body>
</html>
